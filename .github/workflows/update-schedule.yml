name: Update Zwift Climb Portal Schedule

on:
  schedule:
    # Run every day at 18:00 UTC (03:00 JST)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Generate iCalendar (.ics)
        run: |
          python main.py --months-ahead 1 -o dist/zwift_climb_portal.ics
          python main.py --months-ahead 1 -m consolidated -o dist/zwift_climb_portal_consolidated.ics

      - name: Sync to Google Calendar API (Optional)
        if: env.GOOGLE_SERVICE_ACCOUNT_KEY != '' && env.GOOGLE_CALENDAR_ID != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > service_account.json
          python main.py --sync-gcal --calendar-id "$GOOGLE_CALENDAR_ID" --service-account service_account.json
          rm -f service_account.json

      - name: Commit and Push generated .ics files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*.ics
          if git status --porcelain | grep -q "dist/"; then
            git commit -m "Auto-update Zwift Climb Portal calendar [skip ci]"
            git push
          else
            echo "No schedule changes to commit."
          fi
